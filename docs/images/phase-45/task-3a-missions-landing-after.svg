  <text x="1067" y="240" fill="#f4ede5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Janus v1.4</text>
  <text x="1067" y="263" fill="#bcb3a8" font-family="Arial, sans-serif" font-size="12">Approved · Project workspace access</text>
  <rect x="1026" y="309" width="372" height="70" rx="7" fill="#211d18" stroke="#423a31"/>
  <circle cx="1049" cy="333" r="8" fill="none" stroke="#a49b90"/>
  <text x="1067" y="337" fill="#f4ede5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Naive v2.1</text>
  <text x="1067" y="359" fill="#bcb3a8" font-family="Arial, sans-serif" font-size="12">Approved · No local access</text>
  <text x="1026" y="414" fill="#ffb878" font-family="monospace" font-size="10" font-weight="700">FIXED ACCESS</text>
  <rect x="1026" y="429" width="372" height="112" rx="7" fill="#2a241e"/>
  <text x="1041" y="458" fill="#f4ede5" font-family="Arial, sans-serif" font-size="13" font-weight="700">Project workspace access</text>
  <text x="1041" y="483" fill="#bcb3a8" font-family="Arial, sans-serif" font-size="12">This exact profile is fixed for this conversation.</text>
  <text x="1041" y="504" fill="#bcb3a8" font-family="Arial, sans-serif" font-size="12">Forge asks before any bounded operation.</text>
  <text x="1041" y="525" fill="#bcb3a8" font-family="Arial, sans-serif" font-size="12">It cannot be changed here.</text>
  <rect x="1026" y="759" width="372" height="46" rx="7" fill="#ff9a4a"/>
  <text x="1115" y="788" fill="#21150c" font-family="Arial, sans-serif" font-size="13" font-weight="700">Start on Janus v1.4</text>
