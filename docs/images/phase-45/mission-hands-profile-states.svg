<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Mission access approval and tool status</title>
  <desc id="description">A Forge Missions conversation wireframe showing the fixed approved Project Workspace and Terminal profile, a bounded confirmation, and explicit Awaiting Hands state.</desc>
  <rect width="1440" height="960" fill="#17130f"/>
  <rect x="0" y="0" width="220" height="960" fill="#211b16"/>
  <text x="34" y="58" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Forge</text>
  <text x="34" y="125" fill="#df8a45" font-family="system-ui, sans-serif" font-size="16">Missions</text>
  <text x="34" y="166" fill="#baa999" font-family="system-ui, sans-serif" font-size="16">Project Explorer</text>
  <text x="34" y="207" fill="#baa999" font-family="system-ui, sans-serif" font-size="16">Settings</text>
  <rect x="220" y="0" width="390" height="960" fill="#2b231c"/>
  <text x="255" y="60" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Mission conversations</text>
  <rect x="255" y="89" width="320" height="48" rx="8" fill="#4b2b1d" stroke="#df8a45"/>
  <text x="275" y="120" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="16">+ New conversation</text>
  <rect x="255" y="174" width="320" height="80" rx="10" fill="#383027"/>
  <text x="275" y="207" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Migration review</text>
  <text x="275" y="233" fill="#baa999" font-family="system-ui, sans-serif" font-size="14">Project Workspace + Terminal</text>
  <rect x="610" y="0" width="830" height="960" fill="#17130f"/>
  <text x="650" y="60" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Migration review</text>
  <rect x="650" y="84" width="344" height="33" rx="16" fill="#3b2f23" stroke="#7d664e"/>
  <text x="668" y="106" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="14">Mission access: Project Workspace + Terminal</text>
  <text x="650" y="160" fill="#baa999" font-family="system-ui, sans-serif" font-size="15">The mission may use its approved bounded project workspace.</text>
  <rect x="650" y="198" width="720" height="105" rx="10" fill="#252019"/>
  <text x="676" y="232" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tool status · needs confirmation</text>
  <text x="676" y="259" fill="#d6c5b1" font-family="system-ui, sans-serif" font-size="15">Run terminal command in this Project workspace</text>
  <text x="676" y="284" fill="#baa999" font-family="system-ui, sans-serif" font-size="14">This does not change mission access.</text>
  <rect x="1165" y="244" width="82" height="34" rx="7" fill="#df8a45"/>
  <text x="1185" y="266" fill="#17130f" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Allow</text>
  <rect x="1258" y="244" width="82" height="34" rx="7" fill="#383027" stroke="#7d664e"/>
  <text x="1278" y="266" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="14">Deny</text>
  <rect x="650" y="334" width="720" height="78" rx="10" fill="#2d271f"/>
  <text x="676" y="366" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Awaiting hands</text>
  <text x="676" y="392" fill="#d6c5b1" font-family="system-ui, sans-serif" font-size="14">Reconnect this conversation to continue the pending tool request.</text>
  <rect x="650" y="852" width="720" height="62" rx="10" fill="#252019" stroke="#4f4336"/>
  <text x="676" y="890" fill="#8f7d6c" font-family="system-ui, sans-serif" font-size="16">Send a message…</text>
  <text x="950" y="468" fill="#baa999" font-family="system-ui, sans-serif" font-size="13">Creation state (before the conversation exists)</text>
  <rect x="950" y="480" width="390" height="170" rx="14" fill="#2b231c" stroke="#7d664e"/>
  <text x="980" y="519" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Start this mission?</text>
  <text x="980" y="551" fill="#d6c5b1" font-family="system-ui, sans-serif" font-size="15">Access requested by this version</text>
  <text x="980" y="581" fill="#f7e9d3" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Project Workspace + Terminal</text>
  <text x="980" y="608" fill="#baa999" font-family="system-ui, sans-serif" font-size="13">Fixed for this conversation version.</text>
  <rect x="1197" y="603" width="112" height="31" rx="7" fill="#df8a45"/>
  <text x="1219" y="624" fill="#17130f" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Start mission</text>
</svg>
