  <text x="881" y="993" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Run</text>

  <rect x="1002" y="110" width="510" height="822" rx="14" fill="#ffffff" stroke="#d5dae5"/>
  <text x="1030" y="151" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#101d33">Runs</text>
  <text x="1458" y="151" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#0f6eeb">All runs</text>
  <line x1="1030" y1="174" x2="1484" y2="174" stroke="#e7ecf4"/>

  <rect x="1022" y="194" width="470" height="72" rx="10" fill="#eff5fe"/>
  <rect x="1022" y="194" width="4" height="72" rx="2" fill="#0f6eeb"/>
  <text x="1046" y="222" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Draft a release plan</text>
  <text x="1046" y="246" font-family="system-ui, sans-serif" font-size="13" fill="#62748c">Janus · Completed · 2m 14s</text>
  <text x="1466" y="230" font-family="system-ui, sans-serif" font-size="15" text-anchor="end" fill="#0f6eeb">›</text>

  <text x="1030" y="314" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#101d33">Run trace</text>
  <text x="1030" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#62748c">Internal mission activity</text>
  <line x1="1030" y1="358" x2="1484" y2="358" stroke="#e7ecf4"/>

  <circle cx="1051" cy="401" r="7" fill="#0f6eeb"/>
  <line x1="1051" y1="408" x2="1051" y2="718" stroke="#d5dae5" stroke-width="2"/>
  <text x="1074" y="399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Proposer</text>
  <text x="1074" y="422" font-family="system-ui, sans-serif" font-size="13" fill="#263852">Proposed three phases and release checks.</text>
  <text x="1074" y="445" font-family="system-ui, sans-serif" font-size="12" fill="#62748c">Stage 1</text>

  <circle cx="1051" cy="498" r="7" fill="#92600a"/>
  <text x="1074" y="496" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Approver</text>
  <text x="1074" y="519" font-family="system-ui, sans-serif" font-size="13" fill="#263852">Requested a clearer rollback check.</text>
  <text x="1074" y="542" font-family="system-ui, sans-serif" font-size="12" fill="#62748c">Revision requested</text>

  <circle cx="1051" cy="595" r="7" fill="#0f6eeb"/>
  <text x="1074" y="593" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Proposer</text>
  <text x="1074" y="616" font-family="system-ui, sans-serif" font-size="13" fill="#263852">Revised the plan with a rollback gate.</text>
  <text x="1074" y="639" font-family="system-ui, sans-serif" font-size="12" fill="#62748c">Stage 2</text>

  <circle cx="1051" cy="692" r="7" fill="#2e7d52"/>
  <text x="1074" y="690" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Approver</text>
  <text x="1074" y="713" font-family="system-ui, sans-serif" font-size="13" fill="#263852">Approved the plan.</text>
  <text x="1074" y="736" font-family="system-ui, sans-serif" font-size="12" fill="#2e7d52">Approved</text>

  <circle cx="1051" cy="789" r="7" fill="#5b6b83"/>
  <text x="1074" y="787" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#101d33">Implementer</text>
  <text x="1074" y="810" font-family="system-ui, sans-serif" font-size="13" fill="#263852">Prepared the concise Project outcome.</text>
  <text x="1074" y="833" font-family="system-ui, sans-serif" font-size="12" fill="#62748c">Stage 3 · no tools</text>

  <rect x="1024" y="866" width="466" height="42" rx="10" fill="#f7faff" stroke="#d5dae5"/>
  <text x="1257" y="892" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#62748c">Trace is durable and belongs to this run</text>
