<svg viewBox="0 0 1536 1024" width="1536" height="1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Forge Missions — Project conversation and separate Run trace concept</title>
  <desc>A wide Forge workbench concept. The Project conversation holds the person's request and a concise Janus outcome. A distinct right Run trace holds the private Proposer, Approver, and Implementer activity.</desc>

  <rect width="1536" height="1024" fill="#f7faff"/>
  <rect width="180" height="1024" fill="#06284c"/>
  <rect x="180" width="1356" height="86" fill="#f6f8fd"/>
