  <line x1="180" y1="0" x2="180" y2="1024" stroke="#d5dae5"/>

  <text x="24" y="42" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Forge</text>
  <text x="24" y="67" font-family="system-ui, sans-serif" font-size="15" fill="#b9d6f5">AI Workbench</text>
  <text x="28" y="170" font-family="system-ui, sans-serif" font-size="19" fill="#b9d6f5">□</text>
  <text x="28" y="198" font-family="system-ui, sans-serif" font-size="15" fill="#b9d6f5">Project Explorer</text>
  <rect x="12" y="222" width="156" height="72" rx="10" fill="#0c4475"/>
  <rect x="12" y="222" width="5" height="72" rx="3" fill="#32d9f2"/>
  <text x="30" y="252" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff">◎</text>
  <text x="30" y="278" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Missions</text>
  <text x="28" y="956" font-family="system-ui, sans-serif" font-size="19" fill="#b9d6f5">⚙</text>
  <text x="28" y="984" font-family="system-ui, sans-serif" font-size="15" fill="#b9d6f5">Settings</text>

  <text x="216" y="38" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#101d33">Missions</text>
  <text x="216" y="62" font-family="ui-monospace, monospace" font-size="13" fill="#5b6b83">Ship a release planner</text>

  <rect x="204" y="110" width="774" height="822" rx="14" fill="#ffffff" stroke="#d5dae5"/>
  <text x="236" y="151" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#101d33">Project conversation</text>
  <text x="236" y="177" font-family="system-ui, sans-serif" font-size="13" fill="#62748c">Requests and outcomes — not the internal expert discussion</text>
  <line x1="236" y1="198" x2="946" y2="198" stroke="#e7ecf4"/>

  <rect x="535" y="228" width="379" height="62" rx="12" fill="#eff5fe" stroke="#b9d6f5"/>
  <text x="560" y="265" font-family="system-ui, sans-serif" font-size="15" fill="#101d33">Draft a release plan for next Friday.</text>
  <text x="834" y="278" font-family="system-ui, sans-serif" font-size="12" text-anchor="end" fill="#62748c">You</text>

  <rect x="236" y="326" width="678" height="154" rx="12" fill="#f7faff" stroke="#d5dae5"/>
  <text x="260" y="362" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#101d33">Janus run completed</text>
  <rect x="260" y="378" width="82" height="25" rx="13" fill="#e8f5ee"/>
  <text x="301" y="395" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d52">Completed</text>
  <text x="260" y="432" font-family="system-ui, sans-serif" font-size="15" fill="#263852">A three-phase release plan is ready for review.</text>
  <text x="260" y="458" font-family="system-ui, sans-serif" font-size="13" fill="#62748c">3 expert stages · 0 tools · 2m 14s</text>
  <text x="842" y="432" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#0f6eeb">View run trace →</text>

  <text x="590" y="609" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#8a9ab0">Your next instruction starts a new Mission Run.</text>

  <rect x="204" y="948" width="774" height="76" fill="#f7faff"/>
