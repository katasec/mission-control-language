<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Before: folder-open flow with persistent chrome</title>
<desc>Forge window with an always-visible "Open Folder" button top right, a workspace path row, and dead-looking blue placeholder text "Open a folder to begin" that is not actually clickable.</desc>
<rect x="0.5" y="0.5" width="399" height="419" rx="10" fill="#ffffff" stroke="#d9d7d0"/>

<!-- header -->
<line x1="0" y1="52" x2="400" y2="52" stroke="#e6e4dd"/>
<text x="18" y="33" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1a1a18">Forge</text>
<rect x="272" y="16" width="112" height="30" rx="6" fill="#ffffff" stroke="#b4b2a9"/>
<text x="328" y="35" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f5e5a" text-anchor="middle">Open Folder</text>

<!-- path row -->
<line x1="0" y1="84" x2="400" y2="84" stroke="#e6e4dd"/>
<text x="18" y="72" font-family="Consolas, monospace" font-size="11" fill="#888780">C:\Users\ameer\progs\mission-control-language</text>

<!-- content -->
<text x="200" y="210" font-family="Segoe UI, sans-serif" font-size="14" fill="#185fa5" text-anchor="middle">Open a folder to begin</text>

<!-- composer -->
<line x1="0" y1="344" x2="400" y2="344" stroke="#e6e4dd"/>
<rect x="18" y="364" width="298" height="36" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="34" y="387" font-family="Segoe UI, sans-serif" font-size="12" fill="#b4b2a9">Describe what you want to build</text>
<rect x="326" y="364" width="56" height="36" rx="6" fill="#ffffff" stroke="#d9d7d0"/>

<!-- annotations -->
<line x1="328" y1="46" x2="328" y2="16" stroke="#e24b4a" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="328" cy="14" r="9" fill="#fcebeb" stroke="#e24b4a"/>
<text x="328" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#a32d2d" text-anchor="middle">1</text>
<circle cx="200" cy="196" r="9" fill="#fcebeb" stroke="#e24b4a"/>
<text x="200" y="200" font-family="Segoe UI, sans-serif" font-size="11" fill="#a32d2d" text-anchor="middle">2</text>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#e24b4a"/>
  </marker>
</defs>
</svg>
