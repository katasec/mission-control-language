<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Before: stock Fluent visual treatment</title>
  <desc>Forge Desktop's existing chat layout with default gray controls: title, workspace path, message list, tool indicator, and composer with an open plus flyout.</desc>
  <rect x="0.5" y="0.5" width="799" height="459" rx="10" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="28" y="42" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#242424">Forge</text>
  <line x1="24" y1="60" x2="776" y2="60" stroke="#e6e6e6"/>
  <text x="28" y="86" font-family="Segoe UI, sans-serif" font-size="12" fill="#707070">/Users/ada/forge-demo</text>
  <rect x="24" y="104" width="752" height="264" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="44" y="138" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#242424">You</text>
  <text x="44" y="162" font-family="Segoe UI, sans-serif" font-size="14" fill="#242424">Add a header comment to Foo.cs</text>
  <text x="44" y="210" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#242424">Forge</text>
  <text x="48" y="234" font-family="Segoe UI, sans-serif" font-size="12" fill="#707070">✓ Read Foo.cs</text>
  <text x="48" y="256" font-family="Segoe UI, sans-serif" font-size="12" fill="#707070">◌ Editing Bar.cs…</text>
  <text x="44" y="288" font-family="Segoe UI, sans-serif" font-size="14" fill="#242424">I added the header comment and am updating Bar.cs.</text>
  <rect x="24" y="392" width="36" height="36" rx="4" fill="#f3f3f3" stroke="#a6a6a6"/>
  <text x="42" y="416" font-family="Segoe UI, sans-serif" font-size="18" fill="#242424" text-anchor="middle">+</text>
  <rect x="70" y="392" width="602" height="36" rx="4" fill="#ffffff" stroke="#a6a6a6"/>
  <text x="84" y="415" font-family="Segoe UI, sans-serif" font-size="13" fill="#707070">Describe what you want to build</text>
  <rect x="682" y="392" width="94" height="36" rx="4" fill="#f3f3f3" stroke="#a6a6a6"/>
  <text x="729" y="415" font-family="Segoe UI, sans-serif" font-size="13" fill="#242424" text-anchor="middle">Send</text>
  <rect x="24" y="314" width="166" height="64" rx="4" fill="#ffffff" stroke="#a6a6a6"/>
  <text x="42" y="344" font-family="Segoe UI, sans-serif" font-size="13" fill="#242424">Add folder</text>
</svg>
