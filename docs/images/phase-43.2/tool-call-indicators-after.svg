<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>After: quiet inline tool-call indicators</title>
<desc>The same chat transcript with two small muted indicator rows inside the assistant bubble: a completed "Read Foo.cs" row with a checkmark, and a running "Editing Bar.cs" row with a pending dot, both above the assistant's streaming answer text.</desc>
<rect x="0.5" y="0.5" width="399" height="299" rx="10" fill="#ffffff" stroke="#d9d7d0"/>

<!-- user bubble -->
<rect x="140" y="16" width="244" height="40" rx="10" fill="#e6f1fb"/>
<text x="262" y="40" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#0c447c" text-anchor="middle">Add a header comment to Foo.cs</text>

<!-- assistant bubble -->
<rect x="16" y="72" width="280" height="150" rx="10" fill="#f1efe8"/>

<!-- indicator row 1: done -->
<path d="M34,96 l4,4 l7,-8" stroke="#3b6d11" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="100" font-family="Consolas, monospace" font-size="11" fill="#5f5e5a">Read Foo.cs</text>

<!-- indicator row 2: running -->
<circle cx="38" cy="120" r="4" fill="none" stroke="#888780" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="52" y="124" font-family="Consolas, monospace" font-size="11" fill="#888780">Editing Bar.cs&#8230;</text>

<!-- divider -->
<line x1="34" y1="138" x2="282" y2="138" stroke="#e6e4dd"/>

<!-- streaming answer text -->
<text x="34" y="160" font-family="Segoe UI, sans-serif" font-size="12" fill="#2c2c2a">I added the header comment</text>
<text x="34" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#2c2c2a">to Foo.cs and updated</text>
<text x="34" y="196" font-family="Segoe UI, sans-serif" font-size="12" fill="#b4b2a9">Bar.cs&#8230;</text>

<!-- annotations -->
<text x="16" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#3b6d11">Checkmark = tool finished. Dotted circle = tool still running.</text>
<text x="16" y="264" font-family="Segoe UI, sans-serif" font-size="11" fill="#3b6d11">Rows appear inline, in the order the calls happened.</text>
</svg>
