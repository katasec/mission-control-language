# Native MCL experts call this provider directly.
# The runner supplies MCL_HARNESS_MODEL from shared settings.json for this child only.
[providers.default]
provider = "openai"
model = env("MCL_HARNESS_MODEL", "gpt-6.1-sol")
apiKey = env("MCL_API_KEY")

[execution]
backend = "process"
defaultTimeout = "30s"
