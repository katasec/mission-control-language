name: Desktop build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  windows:
    name: Windows ARM64 bundle
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Install GNU Make
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Publish Windows Desktop
        shell: pwsh
        run: make OS=Windows_NT desktop-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows Desktop
        shell: pwsh
        run: |
          $archive = 'dist/forge-desktop-win-arm64.zip'
          Compress-Archive -Path dist/forge-desktop -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  forge-desktop-win-arm64.zip" | Set-Content -NoNewline -Encoding ascii "$archive.sha256"

      - name: Upload Windows Desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: forge-desktop-win-arm64
          path: |
            dist/forge-desktop-win-arm64.zip
            dist/forge-desktop-win-arm64.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS ARM64 bundle
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Publish macOS Desktop
        run: make desktop-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS Desktop
        run: |
          archive='dist/forge-desktop-osx-arm64.zip'
          ditto -c -k --sequesterRsrc --keepParent dist/forge-desktop "$archive"
          shasum -a 256 "$archive" | awk '{ print $1 "  forge-desktop-osx-arm64.zip" }' > "$archive.sha256"

      - name: Upload macOS Desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: forge-desktop-osx-arm64
          path: |
            dist/forge-desktop-osx-arm64.zip
            dist/forge-desktop-osx-arm64.zip.sha256
          if-no-files-found: error
